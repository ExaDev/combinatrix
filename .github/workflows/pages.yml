name: Pages

# Deploys the explorer in site/ to GitHub Pages as the repository's project site, https://exadev.github.io/combinatrix/. The repository's Pages source is "GitHub Actions". The site imports the library from src/, so a change to either rebuilds it; dependency changes arrive through package.json.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/**
      - package.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  determine-runner:
    uses: ./.github/workflows/determine-runner.yml

  build:
    name: Build
    needs: determine-runner
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The site is built from the library's source, so the library's own build and its JSON Schema are not needed.
      - run: pnpm run site:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: [determine-runner, build]
    runs-on: ${{ fromJson(needs.determine-runner.outputs.selected-runner) }}
    timeout-minutes: 10
    # Two deploys never overlap and a running one is never cancelled: a cancelled deployment can leave the site half-published, so the next run queues behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write # to publish the artifact
      id-token: write # OIDC proof to the Pages service that the deploy comes from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
